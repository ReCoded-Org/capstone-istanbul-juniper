name: Node.js CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
          steps:
            - run: yarn install
            - run: yarn run fix
            - run: "[[ -z $(git --no-pager diff -- . ':(exclude)yarn.lock' ':(exclude)yarn.lock') ]]"
            - run: yarn run test --passWithNoTests
            - run: export CI=1
workflows:
  build-and-test:
    jobs:
      - build-and-test
